[project]
name = "brand-manager-orchestrator"
version = "0.1.0"
description = "Daily image generation agent worker"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "httpx>=0.27.0",
  "redis>=5.2.0",
  "pillow>=11.0.0",
  "openai>=1.57.0",
  "anthropic>=0.32.0",
  "replicate>=1.0.7,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]
